apiVersion: apps/v1
kind: Deployment
metadata:
  name: huginn-mcp
  namespace: huginn
  labels:
    app: huginn-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: huginn-mcp
  template:
    metadata:
      labels:
        app: huginn-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
      containers:
        - name: mcp
          # Substitute <owner> with your registry namespace.
        image: ghcr.io/<owner>/huginn-mcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          env:
            # HUGINN_MCP_SERVICE_TOKEN comes from the shared secret.
            - name: HUGINN_MCP_HUB_URL
              value: "http://huginn-hub"
            - name: HUGINN_MCP_TRANSPORT
              value: "streamable-http"
            # The ingress stamps X-Real-IP; trust it only from the pod
            # network (otherwise a client-supplied X-Forwarded-For could
            # spoof the address an IP-pinned MCP token is checked against).
            - name: HUGINN_MCP_TRUST_PROXY
              value: "true"
            - name: HUGINN_MCP_TRUSTED_PROXY_CIDRS
              value: "10.244.0.0/16,172.16.0.0/12,127.0.0.0/8"
            - name: HUGINN_MCP_HOST
              value: "0.0.0.0"
            - name: HUGINN_MCP_PORT
              value: "9000"
          envFrom:
            - secretRef:
                name: huginn-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: huginn-mcp
  namespace: huginn
  labels:
    app: huginn-mcp
spec:
  selector:
    app: huginn-mcp
  ports:
    - name: http
      port: 80
      targetPort: 9000
  type: ClusterIP
