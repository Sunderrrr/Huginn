name: ci-scheduled

# Weekly health check: new advisories (like the rustls CVEs that landed
# mid-flight) and the parity gate, even when no PR is open.

permissions:
  contents: read

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

# No cancel-in-progress here: a weekly run that gets interrupted halfway is
# worse than one that finishes.
concurrency:
  group: ci-scheduled

jobs:
  audit:
    name: dependency audit (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [worker-rs, mcp-rs, hub-rs]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No token left in .git/config — a build script must not be able
          # to exfiltrate the job's GITHUB_TOKEN.
          persist-credentials: false
      - name: Audit the lockfile
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ matrix.component }}
          # RUSTSEC-2023-0071 (unpatched) — rationale in audit.toml at the
          # repo root: `rsa` IS compiled into hub-rs (WebAuthn RS256
          # verification), but the Marvin attack targets PKCS#1 v1.5
          # *decryption*, which the hub never performs; the verification path
          # it uses is constant-time.
          ignore: RUSTSEC-2023-0071

  parity:
    name: API parity gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: huginn
          POSTGRES_PASSWORD: x
          POSTGRES_DB: huginn
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: hub-rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: hub-rs
      - name: Build hub-rs
        run: cargo build --release --locked
      - name: Boot hub-rs and run the parity gate
        env:
          HUGINN_ENV: dev
          HUGINN_REQUIRE_TLS: "false"
          HUGINN_REQUIRE_ADMIN_MFA: "false"
          HUGINN_DATABASE_URL: postgresql://huginn:x@127.0.0.1:5432/huginn
          HUGINN_JWT_SECRET: parity-jwt-secret-0123456789abcdef012345
          HUGINN_SECRET_HASH_KEY: parity-hmac-key-0123456789abcdef012345
          HUGINN_MCP_SERVICE_TOKEN: parity-mcp-token-0123456789abcdef0123
          HUGINN_MFA_ENCRYPTION_KEY: parity-mfa-key-0123456789abcdef01234
          HUGINN_BOOTSTRAP_ADMIN_USERNAME: admin
          HUGINN_BOOTSTRAP_ADMIN_PASSWORD: parity-admin-pass-123
        run: |
          ./target/release/huginn-hub > /tmp/hub.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/healthz && break; sleep 1; done
          ./target/release/huginn-parity capture --base http://127.0.0.1:8000 \
            --admin-user admin --admin-pass parity-admin-pass-123 --out /tmp/golden
          ./target/release/huginn-parity diff golden/python /tmp/golden

  # The worker also ships for Windows (install.ps1, `#[cfg(windows)]` code
  # paths). Nothing compiled it, so a Windows-only break could only surface on
  # a user's machine. This weekly job compiles the worker and its test
  # binaries on a Windows runner — the guard is *not* a merge gate yet (the
  # Windows test code is not known to compile), it exists to make the rot
  # visible instead of silent.
  worker-windows:
    name: worker (windows build)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker-rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: worker-rs
      - name: Build the worker (MSVC)
        run: cargo build --release --locked
      - name: Compile the test binaries (no run)
        run: cargo test --release --locked --no-run
