name: ci-rust

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ["worker-rs/**", "mcp-rs/**", "hub-rs/**"]
  pull_request:
    paths: ["worker-rs/**", "mcp-rs/**", "hub-rs/**"]

# A new push supersedes the previous run: cancel it instead of burning
# runner minutes on an outdated commit.
concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

# Runs per crate (worker-rs, mcp-rs, hub-rs — all land with their crate on the
# branch). CI policy: fmt clean, clippy warnings as errors, tests green, zero
# known vulnerabilities in dependencies. hub-rs additionally runs the API
# parity gate: its responses must match the Python hub's golden responses.

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        component: [worker-rs, mcp-rs, hub-rs]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No token left in .git/config — a build script must not be able
          # to exfiltrate the job's GITHUB_TOKEN.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.component }}
      - name: Format
        run: cargo fmt --check
      - name: Lint (clippy, warnings as errors)
        # --all-targets: the test code is linted too (a warning there is a
        # warning).
        run: cargo clippy --release --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --release --locked
      - name: Audit dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ matrix.component }}
          # RUSTSEC-2023-0071 (unpatched) — rationale in audit.toml at the repo
          # root: `rsa` only enters hub-rs's lockfile through sqlx's unused
          # mysql feature. Kept in both places because audit-check resolves the
          # config from the workspace root.
          ignore: RUSTSEC-2023-0071

  # The browser end-to-end test: a REAL Obscura release is downloaded,
  # installed (SHA-256 verified), driven through every step action against a
  # local fixture, and torn down. It is the flagship feature — it must not
  # rot in a branch. Needs network access to the GitHub release CDN.
  worker-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker-rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: worker-rs
      - name: Build
        run: cargo build --release --locked
      - name: Browser end-to-end (real Obscura)
        env:
          # Opt-in flag of the ignored E2E test: downloads the pinned
          # release, installs it, drives every action, checks the cleanup.
          HUGINN_OBSCURA_E2E: "1"
        run: cargo test --release --locked -- --ignored

  # The migration release gate: hub-rs must answer exactly like the Python
  # hub (golden responses captured from it, see hub-rs/huginn-parity (Rust
  # binary)). The same job also runs the live-DB test suites (they need a
  # real PostgreSQL — the service below provides one).
  hub-rs-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: huginn
          POSTGRES_PASSWORD: x
          POSTGRES_DB: huginn
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: hub-rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No token left in .git/config — a build script must not be able
          # to exfiltrate the job's GITHUB_TOKEN.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: hub-rs
      - name: Build
        run: cargo build --release --locked
      - name: Live-database test suites
        # These suites (RBAC, enrollment, session revocation, browser
        # endpoints, audit chain…) need a real PostgreSQL; they drop and
        # recreate the schema, so they run BEFORE the hub boots.
        env:
          HUGINN_TEST_DATABASE_URL: postgresql://huginn:x@127.0.0.1:5432/huginn
        run: cargo test --release --locked
      - name: Start hub-rs against the service database
        run: |
          HUGINN_ENV=dev \
          HUGINN_REQUIRE_TLS=false \
          HUGINN_REQUIRE_ADMIN_MFA=false \
          HUGINN_DATABASE_URL=postgresql://huginn:x@127.0.0.1:5432/huginn \
          HUGINN_JWT_SECRET=parity-jwt-secret-0123456789abcdef012345 \
          HUGINN_SECRET_HASH_KEY=parity-hmac-key-0123456789abcdef012345 \
          HUGINN_MCP_SERVICE_TOKEN=parity-mcp-token-0123456789abcdef0123 \
          HUGINN_MFA_ENCRYPTION_KEY=parity-mfa-key-0123456789abcdef01234 \
          HUGINN_BOOTSTRAP_ADMIN_USERNAME=admin \
          HUGINN_BOOTSTRAP_ADMIN_PASSWORD=parity-admin-pass-123 \
          ./target/release/huginn-hub > /tmp/hub-rs.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          cat /tmp/hub-rs.log
          exit 1
      - name: Parity gate (diff vs reference goldens)
        run: |
          ./target/release/huginn-parity capture \
            --base http://127.0.0.1:8000 \
            --admin-user admin --admin-pass parity-admin-pass-123 \
            --out /tmp/golden-rust
          ./target/release/huginn-parity diff golden/python /tmp/golden-rust
      - name: Docker image (smoke)
        run: docker build -t huginn-hub:ci .
