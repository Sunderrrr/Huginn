name: ci-rust

on:
  push:
    branches: [main]
    paths: ["worker-rs/**", "mcp-rs/**", ".github/workflows/ci-rust.yml"]
  pull_request:
    paths: ["worker-rs/**", "mcp-rs/**", ".github/workflows/ci-rust.yml"]

# Runs per crate (worker-rs, mcp-rs). CI policy: fmt clean, clippy warnings as
# errors, tests green, zero known vulnerabilities in dependencies.

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [worker-rs, mcp-rs]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: ${{ matrix.component }}
      - name: Format
        run: cargo fmt --check
      - name: Lint (clippy, warnings as errors)
        run: cargo clippy --release --locked -- -D warnings
      - name: Test
        run: cargo test --release --locked
      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          working-directory: ${{ matrix.component }}
