name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-worker-rs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: taiki-e/install-action@cargo-zigbuild
      - name: Install zig (cross-linker for musl targets)
        run: pip install ziglang
      - name: Cross-compile static worker binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p ../dist
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            case "$t" in
              x86_64-*) arch=amd64 ;;
              aarch64-*) arch=arm64 ;;
            esac
            HUGINN_WORKER_VERSION="$VERSION" cargo zigbuild --release --locked --target "$t"
            cp "target/$t/release/huginn-worker" "../dist/huginn-worker-linux-$arch"
          done
        shell: bash
      - name: Generate checksums
        working-directory: .
        run: |
          cd dist
          sha256sum huginn-worker-* > checksums.txt
          cat checksums.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/huginn-worker-*
            dist/checksums.txt
          generate_release_notes: true

  build-mcp-rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build + test MCP server
        working-directory: mcp-rs
        run: |
          cargo build --release --locked
          cargo test --release
          cargo clippy --release -- -D warnings
      - name: Docker image (smoke)
        run: docker build -t huginn-mcp:${{ github.ref_name }} mcp-rs

  build-hub-rs:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: huginn
          POSTGRES_PASSWORD: huginn
          POSTGRES_DB: huginn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U huginn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build + test hub
        working-directory: hub-rs
        run: |
          cargo build --release --locked
          cargo test --release
          cargo clippy --release -- -D warnings
      - name: Docker image (smoke)
        run: docker build -t huginn-hub:${{ github.ref_name }} hub-rs
      - name: Boot smoke (migrations + /healthz)
        run: |
          docker run -d --name hub --network host \
            -e HUGINN_ENV=dev \
            -e HUGINN_DATABASE_URL="postgresql://huginn:huginn@127.0.0.1:5432/huginn" \
            huginn-hub:${{ github.ref_name }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              echo
              echo "hub booted and answered /healthz"
              docker logs hub
              docker rm -f hub
              exit 0
            fi
            sleep 2
          done
          echo "hub did not answer /healthz in time" >&2
          docker logs hub >&2
          docker rm -f hub
          exit 1
        shell: bash
