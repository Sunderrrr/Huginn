name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

# A release is never cancelled: a half-published tag is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}

jobs:
  build-worker-rs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: worker-rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No token left in .git/config — a build script must not be able
          # to exfiltrate the job's GITHUB_TOKEN.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: worker-rs
      - uses: taiki-e/install-action@d2bea38207d08b13b798c8a031b0912d13e2a802 # cargo-zigbuild
      - name: Install zig (cross-linker for musl targets)
        run: pip install --no-cache-dir ziglang==0.17.0
      - name: Cross-compile static worker binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p ../dist
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            case "$t" in
              x86_64-*) arch=amd64 ;;
              aarch64-*) arch=arm64 ;;
            esac
            HUGINN_WORKER_VERSION="$VERSION" cargo zigbuild --release --locked --target "$t"
            cp "target/$t/release/huginn-worker" "../dist/huginn-worker-linux-$arch"
          done
        shell: bash
      - name: Generate checksums
        working-directory: .
        run: |
          cd dist
          sha256sum huginn-worker-* > checksums.txt
          cat checksums.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/huginn-worker-*
            dist/checksums.txt
          generate_release_notes: true

  build-mcp-rs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No token left in .git/config — a build script must not be able
          # to exfiltrate the job's GITHUB_TOKEN.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: mcp-rs
      - name: Build + test MCP server
        working-directory: mcp-rs
        run: |
          cargo build --release --locked
          cargo test --release --locked
          cargo clippy --release --locked --all-targets -- -D warnings
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push huginn-mcp
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ github.ref_name }}
        run: |
          owner="${OWNER,,}"   # GHCR requires lowercase repository names
          docker build -t "ghcr.io/${owner}/huginn-mcp:${VERSION}" -t "ghcr.io/${owner}/huginn-mcp:latest" mcp-rs
          docker push "ghcr.io/${owner}/huginn-mcp:${VERSION}"
          docker push "ghcr.io/${owner}/huginn-mcp:latest"

  build-hub-rs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: huginn
          POSTGRES_PASSWORD: huginn
          POSTGRES_DB: huginn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U huginn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No token left in .git/config — a build script must not be able
          # to exfiltrate the job's GITHUB_TOKEN.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: hub-rs
      - name: Build + test hub
        working-directory: hub-rs
        run: |
          cargo build --release --locked
          cargo test --release --locked
          cargo clippy --release --locked --all-targets -- -D warnings
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push huginn-hub
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ github.ref_name }}
        run: |
          owner="${OWNER,,}"   # GHCR requires lowercase repository names
          docker build -t "ghcr.io/${owner}/huginn-hub:${VERSION}" -t "ghcr.io/${owner}/huginn-hub:latest" hub-rs
          docker push "ghcr.io/${owner}/huginn-hub:${VERSION}"
          docker push "ghcr.io/${owner}/huginn-hub:latest"
      - name: Boot smoke (migrations + /healthz)
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ github.ref_name }}
        run: |
          owner="${OWNER,,}"
          docker run -d --name hub --network host \
            -e HUGINN_ENV=dev \
            -e HUGINN_DATABASE_URL="postgresql://huginn:huginn@127.0.0.1:5432/huginn" \
            "ghcr.io/${owner}/huginn-hub:${VERSION}"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              echo
              echo "hub booted and answered /healthz"
              docker logs hub
              docker rm -f hub
              exit 0
            fi
            sleep 2
          done
          echo "hub did not answer /healthz in time" >&2
          docker logs hub >&2
          docker rm -f hub
          exit 1
        shell: bash
