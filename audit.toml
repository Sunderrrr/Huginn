[advisories]
ignore = [
    # RUSTSEC-2023-0071 (Marvin Attack, `rsa` crate) — no patched version
    # exists (patched = [] by design; the crate is unmaintained upstream).
    #
    # Not applicable here, and the reason is about *how* the crate is used,
    # not about whether it is in the tree: `rsa` IS compiled into the hub
    # (a direct dependency for WebAuthn RS256 attestation verification,
    # `cargo tree -i rsa` resolves to huginn-hub), but the Marvin attack
    # targets PKCS#1 v1.5 *decryption* — the padding-index leak lives in
    # `rsa::algorithms::pkcs1v15::decrypt_inner`. Huginn never decrypts with
    # RSA (no OAEP/PKCS#1 decryption anywhere), and the path it does use —
    # signature *verification* (`pkcs1v15_sign_unpad`) — is constant-time:
    # every comparison goes through `subtle::ConstantTimeEq` and is
    # accumulated in `ok` with no early exit, so no padding byte is leaked.
    # Nothing else in the tree pulls `rsa` in (jsonwebtoken moved to the
    # `aws_lc_rs` backend, which does not use the `rsa` crate).
    "RUSTSEC-2023-0071",
]
