[package]
name = "huginn-hub"
version = "0.1.0"
edition = "2021"
description = "Huginn hub (Rust port of hub/) — API, auth, audit, task routing"
license = "Apache-2.0"

[[bin]]
name = "huginn-hub"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "trace"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "bigdecimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Security primitives (parity-tested against the Python hub's vectors).
argon2 = "0.5"
sha1 = "0.10"
sha2 = { version = "0.10", features = ["oid"] }
hmac = "0.12"
base64 = "0.22"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
rand = "0.8"
subtle = "2"
thiserror = "2"
# WebAuthn ceremony crypto (services/webauthn.rs): CBOR attestation objects and
# COSE keys via ciborium; ES256/RS256/EdDSA signature verification via the
# RustCrypto stack; x509-cert parses the leaf certificate of x5c attestation
# statements (packed / fido-u2f). All audit-clean (see the audit.toml at the
# workspace root).
ciborium = "0.2"
signature = "3"
p256 = "0.14"
ed25519-dalek = "2"
rsa = "0.9"
x509-cert = "0.2"
tracing = "0.1"
# Stream trait for the SSE body of GET /api/events (fleet/events.rs); already in
# the dependency graph via tokio, so no new transitive crates.
tokio-stream = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# OIDC/SSO (port of hub/app/core/oidc.py): HTTP client + RS256/ES256 ID-token
# verification against the provider's JWKS. `jsonwebtoken` runs on the
# `aws_lc_rs` backend: the `rust_crypto` backend pins p256/p384 0.13, whose
# elliptic-curve stack ships crypto-bigint 0.5 (RUSTSEC-2026-0387 — timing
# variability in operations meant to be constant-time). aws-lc-rs verifies
# RS256/ES256 with the same jsonwebtoken semantics and no vulnerable crate in
# the tree; it does need a C toolchain (cmake) at build time, which the
# Dockerfile's build stage installs. reqwest/ldap3 use rustls (ring), which
# `sqlx`'s TLS already requires. (Note: `rsa` is present for the WebAuthn port
# too; the pre-existing RUSTSEC-2023-0071 is covered by the ignore in
# audit.toml / CI.)
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "blocking"] }
regex = "1"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs", "use_pem"] }
# LDAP/LDAPS fallback (port of hub/app/core/ldap.py). rustls-based TLS avoids an
# OpenSSL/pkg-config build dependency.
ldap3 = { version = "0.12", default-features = false, features = ["sync", "tls-rustls-ring"] }
# Database backups to S3-compatible storage (services/backup/): gzip streaming
# compression of the SQL export (flate2 is pure Rust, no zlib C build). The S3
# client itself is hand-rolled on reqwest + SigV4 (hmac/sha2 above) — no AWS SDK.
flate2 = "1"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# Fake S3 server for the backup storage tests (services/backup/s3.rs): PUT /
# LIST / HEAD / DELETE round-trips without a real bucket.
wiremock = "0.6"
# Self-signed X.509 leaf certificates for the WebAuthn `x5c` attestation tests.
rcgen = "0.13"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
