server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers (mirrored by the Caddy edge in production — kept here so
  # the dashboard is defended even served standalone). CSP has no third-party
  # origins: fonts are self-hosted and the theme bootstrap is an external file.
  # `form-action` and `frame-src` have no fallback to `default-src`, so they
  # are set explicitly: a form can only post to this origin and nothing may
  # be framed.
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; base-uri 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # SPA history fallback. index.html must never be cached: it's the only file
  # whose name doesn't change between builds, so a stale copy pins the browser
  # to old (hashed) JS/CSS after a deploy.
  location / {
    try_files $uri $uri/ /index.html;
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires -1;
  }

  # Cache hashed assets aggressively (content-hash in the filename busts cache).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
