[package]
name = "huginn-worker"
version = "0.1.0"
edition = "2021"
description = "Huginn fleet worker daemon (Rust port of the Go worker — identical wire protocol)"
license = "Apache-2.0"

[[bin]]
name = "huginn-worker"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "sync", "signal", "fs"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
regex = "1"

# Platform-specific dependencies: a Linux build pulls none of the Windows
# crates, and a Windows build pulls no libc.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Windows service (SCM) management + the service dispatcher.
windows-service = "0.7"
# Job Objects: kill a timed-out command's whole descendant tree (the Windows
# equivalent of the Unix process-group kill).
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
